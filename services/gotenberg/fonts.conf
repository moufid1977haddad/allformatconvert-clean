<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  "Calibri Light" is a distinct font name from "Calibri" - Office themes
  use it specifically for title/heading placeholders (PowerPoint's default
  title style, Word's default Heading 1 in several built-in themes). The
  base Gotenberg image installs fonts-crosextra-carlito, which is what lets
  plain "Calibri" resolve correctly with no fontconfig rule at all - that
  substitution comes from LibreOffice's own internal font-replacement
  table, which lists "Calibri" -> "Carlito" but does not separately list
  "Calibri Light". Confirmed empirically (phase 1 diagnostic, 2026-09-01):
  requesting "Calibri Light" through the current production service
  produces an embedded LiberationSans run instead of Carlito.

  This rule intercepts the request at the fontconfig layer (the fallback
  LibreOffice uses on Linux once its own table has no match) before it
  reaches that fallback, redirecting "Calibri Light" to the same Carlito
  already used for "Calibri". Carlito ships in one weight, so this does not
  reproduce the *lighter* stroke weight Calibri Light actually has - it
  gets the correct family and metrics, not a pixel-identical weight match.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Calibri Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>

  <!--
    Arial Narrow -> Liberation Sans Narrow (now installed via apt in the
    Dockerfile - see its comment for the full evidence and license check).
    Unlike Calibri Light, it's possible LibreOffice's own internal table
    already lists this exact pairing and would resolve it correctly now
    that the font is actually present, without needing this rule at all -
    that's unconfirmed without a real deploy. This rule is added anyway as
    a guarantee: if LO's own table already handles it, this rule simply
    never fires (no conflict); if it doesn't, this is what fixes it, the
    same way the Calibri Light rule above does.
  -->
  <match target="pattern">
    <test name="family"><string>Arial Narrow</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans Narrow</string></edit>
  </match>
</fontconfig>
